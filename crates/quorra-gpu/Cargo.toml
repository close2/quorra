[package]
name = "quorra-gpu"
description = "The device half of the quorra document renderer: wgpu, pipelines, atlas, frames."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# Versions are pinned once, in the workspace manifest, and argued for there and in
# doc/adr/0002.
[dependencies]
quorra-scene.workspace = true
thiserror.workspace = true
wgpu.workspace = true
pollster.workspace = true

[dev-dependencies]
# PNG artefacts for failing golden tests: straight-alpha RGBA in, which is exactly what
# a `Readback` frame hands back (§3 of the brief), so no conversion sits between a
# failing test and the image a person looks at.
png.workspace = true
# The surface-path smoke test's window; see the workspace manifest.
winit.workspace = true
# Already a dependency of the library; repeated here so that `tests/function_device.rs` can
# drive a raw `wgpu` compute pass of its own. That test runs the *generated* WGSL against an
# independent host evaluation of the same program, which needs a pipeline this crate has no
# reason to own — checking a shader is not the same job as compositing a frame.
pollster.workspace = true
# The ISO 32000-2 §7.10.5 conformance corpus and its reference evaluator, run on the device
# by `tests/function_conformance.rs`. A dev-dependency and nothing else: the library must not
# link a corpus, and the corpus must stay linkable from a test with no device.
quorra-function-conformance.workspace = true
# The pages `tests/archetypes.rs` gates and the `examples/` instruments measure, defined
# once (ADR 0060). A dev-dependency reaches tests *and* examples, which is the property
# no arrangement inside this crate has: an example cannot reach a `#[cfg(test)]` module
# or anything under `tests/`.
quorra-pages.workspace = true

[lints]
workspace = true
