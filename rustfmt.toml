# Only options stable in rustfmt are used here.
#
# Several appealing settings — `imports_granularity`, `group_imports`,
# `wrap_comments` — are nightly-only. Adopting them would make `cargo fmt --check`
# in CI depend on a nightly toolchain for a purely cosmetic gain, so they are
# deliberately left out. Revisit if they stabilise.
edition = "2024"
max_width = 100
newline_style = "Unix"
use_field_init_shorthand = true
use_try_shorthand = true
